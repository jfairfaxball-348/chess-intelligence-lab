[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-intelligence-lab"
version = "0.1.0"
description = "Independent reproducible chess intelligence research laboratory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.999,<2"]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
chesslab = "chesslab.cli:main"
chesslab-uci = "chesslab.uci:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
